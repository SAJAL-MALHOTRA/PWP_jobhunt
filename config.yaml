filters:
  include_titles:
    - '\b(intern|internship|trainee|apprentice|fellow|fellowship)\b'
    - '\b(software|sde|developer|engineer)\b.*\b(intern|internship)\b'
    - '\b(frontend|front-end|backend|back-end|full-stack|fullstack|web)\b.*\b(intern|internship|engineer|developer)\b'
    - '\b(ai|ml|machine learning|applied ai)\b.*\b(intern|internship|engineer)\b'
    - '\bsde\b'
    - '\bsde\s*-?\s*(i{1,2}|[12]|intern)\b'
    - 'software development engineer'
    - 'software engineer'
    - 'junior software engineer'
    - 'site reliability engineer'
    - '\bsre\b'
    - 'member of technical staff'

  exclude_titles:
    - '\b(staff|principal|distinguished|architect)\b'
    - '\bsenior\b'
    - '\b(lead|manager|management|director|vp|vice president|head of|chief|cto)\b'
    - '\b(sales|account executive|marketing|recruit|recruiter|talent|legal|compliance|finance|operations)\b'

  locations:
    - bangalore
    - bengaluru
    - hyderabad
    - pune
    - mumbai
    - delhi
    - noida
    - gurgaon
    - gurugram
    - india

  allow_remote: true
  max_age_days: 30

screen_batch_size: 8
screen_jd_chars: 1400
draft_jd_chars: 6000
score_threshold: 7.0
max_per_digest: 5

companies_file: companies.yaml
profile_file: profile.json
seen_file: seen.json
digest_file: out/digest.html
tracker_csv: out/tracker.csv
